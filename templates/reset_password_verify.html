{% extends "base.html" %}

{% block title %}Новый пароль — SmartFridge{% endblock %}

{% block content %}
<h1 class="page-title">Новый пароль</h1>

<div class="form-card">
  {% if errors %}
    <div class="flashes">
      {% for error in errors %}
        <div class="flash flash-error">{{ error }}</div>
      {% endfor %}
    </div>
  {% endif %}

  <p class="form-hint">
    Мы отправили код на <strong>{{ email }}</strong>. Введите его и новый пароль.
  </p>

  <form method="post" autocomplete="on">
    <label class="field">
      <span>Код из письма</span>
      <input
        type="text"
        name="code"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="6"
        placeholder="000000"
        autofocus
        required
      >
    </label>

    <label class="field">
      <span>Новый пароль — минимум 8 символов</span>
      <input type="password" name="password" autocomplete="new-password" required>
    </label>

    <label class="field">
      <span>Повторите пароль</span>
      <input type="password" name="password2" autocomplete="new-password" required>
    </label>

    <button type="submit" class="btn btn-primary btn-block">Сменить пароль</button>
  </form>

  <p class="form-footer">
    <a href="{{ url_for('login') }}">Вернуться ко входу</a>
  </p>
</div>
{% endblock %}
