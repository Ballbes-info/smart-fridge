{% macro password_field(id,name,label,autocomplete='new-password',minimum=8,match='') %}
<div class="field password-field"><label for="{{ id }}" class="password-label">{{ label }}</label><div class="password-control"><input type="password" id="{{ id }}" name="{{ name }}" autocomplete="{{ autocomplete }}" required maxlength="256"{% if minimum %} minlength="{{ minimum }}"{% endif %}{% if match %} data-password-match="{{ match }}"{% endif %}><button type="button" class="password-toggle" data-password-toggle aria-controls="{{ id }}" aria-label="Показать пароль: {{ label }}" aria-pressed="false" data-field-label="{{ label }}"><svg data-eye-open width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><svg data-eye-closed hidden width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m3 3 18 18M9.5 5.3A12 12 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3.1 3.9M6.2 6.2A22 22 0 0 0 2 12s3.5 7 10 7a12 12 0 0 0 5.7-1.5"/></svg></button></div><small class="password-caps" data-caps-lock hidden>Включён Caps Lock</small></div>
{% endmacro %}
