{% macro field(key, label, values, errors, type='text', required=false, maxlength=none, placeholder='') %}
<div class="product-field"><label for="product-{{ key }}">{{ label }}{% if required %}<span class="product-required">обязательно</span>{% endif %}</label><input id="product-{{ key }}" name="{{ key }}" type="{{ type }}" value="{{ values[key] }}"{% if key in ['quantity','price','calories','protein','fat','carbs'] %} inputmode="decimal"{% elif key in ['shelf_value','barcode'] %} inputmode="numeric"{% endif %} {% if required %}required{% endif %}{% if maxlength %} maxlength="{{ maxlength }}"{% endif %} {% if type=='text' %}autocomplete="off"{% endif %} {% if placeholder %}placeholder="{{ placeholder }}"{% endif %}{% if errors[key] %} aria-invalid="true" aria-describedby="error-{{ key }}"{% endif %}>{% if errors[key] %}<small class="product-error" id="error-{{ key }}">{{ errors[key] }}</small>{% endif %}</div>
{% endmacro %}
