{% from 'icons.html' import icon %}
{% macro display(size='') -%}
<div class="display-art {{ size }}" aria-hidden="true">
  <div class="display-glow"></div>
  <div class="display-device">
    <div class="display-camera"></div>
    <div class="display-screen">
      <div class="display-top"><span class="display-mark"><i></i><i></i><i></i></span><span class="display-tools"><i></i><i></i><span class="display-online"></span></span></div>
      <div class="display-layout">
        <div class="display-nav">{{ icon('grid') }}{{ icon('leaf') }}{{ icon('clock') }}</div>
        <div class="display-overview">
          <div class="display-temperature"><svg viewBox="0 0 120 120" fill="none"><circle cx="60" cy="60" r="48" stroke="#dce8d1" stroke-width="3"/><circle class="display-arc" cx="60" cy="60" r="48" stroke="#8fac65" stroke-width="3" stroke-linecap="round" stroke-dasharray="220 302" transform="rotate(-90 60 60)"/></svg><span>+4<small>°</small></span></div>
          <div class="display-summary"><strong>24 <small>продукта</small></strong><span></span><i></i></div>
          <div class="display-leaf">{{ icon('leaf') }}<span></span><i></i></div>
          <div class="display-wave"><svg viewBox="0 0 260 60" fill="none"><path d="M1 48H259M1 23H259" stroke="#dce5d6" stroke-width="1"/><path class="display-wave-path" d="M1 40c21 0 24-25 45-25s24 19 45 19 25-26 47-26 24 14 45 14 23-12 45-12h31" stroke="#8ca56b" stroke-width="2.5" stroke-linecap="round"/></svg></div>
        </div>
      </div>
    </div>
    <span class="display-indicator"></span><span class="display-speaker"></span>
  </div>
  <div class="display-ground"></div>
</div>
{%- endmacro %}
