{% extends "base.html" %}
{% block title %}Сброс пароля — SmartFridge{% endblock %}

{% block content %}
<section class="auth-page auth-page-single">
  <div class="auth-aside">
    <p class="section-tag"><i></i> ВОССТАНОВЛЕНИЕ ДОСТУПА</p>
    <h1>НОВЫЙ<br><em>ПАРОЛЬ.</em></h1>
    <p>Обновите данные доступа к своему аккаунту.</p>
  </div>

  <div class="auth-card">
    <h2>Сменить пароль</h2>
    <p class="auth-description">Укажите новый пароль для аккаунта.</p>

    <form method="post" action="{{ url_for('reset_password') }}" class="industrial-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <label class="field">
        <span>Электронная почта</span>
        <input type="email" name="email" autocomplete="email"
               placeholder="name@example.com" required>
      </label>

      <label class="field">
        <span>Новый пароль</span>
        <input type="password" name="password" autocomplete="new-password"
               placeholder="Новый пароль" required minlength="8">
      </label>

      <button class="btn btn-primary action-wide" type="submit">
        Обновить пароль
      </button>
    </form>

    <div class="auth-bottom">
      <a href="{{ url_for('login') }}">← Вернуться ко входу</a>
    </div>
  </div>
</section>
{% endblock %}
