{% if assistant_pet %}
<aside class="sf-companion" aria-label="ИИ-питомец" data-active-job="{{ assistant_pet_pending.id if assistant_pet_pending else '' }}" data-active-mode="{{ assistant_pet_pending.mode if assistant_pet_pending else 'chat' }}">
<button class="sf-companion-open" type="button" aria-label="Клевер: открыть ИИ-помощника" aria-expanded="false" aria-controls="companion-panel" title="Открыть помощника">
<svg viewBox="0 0 80 90" width="58" height="66" fill="none" aria-hidden="true"><ellipse class="pet-shadow" cx="40" cy="82" rx="24" ry="3"/><g class="pet-body"><path class="pet-ear" d="M27 42C10 14 16 3 23 6c9 4 10 25 10 34M45 40C42 15 49 1 56 6c8 7-1 28-6 37"/><path class="pet-fill" d="M16 56c0-17 10-26 24-26s24 9 24 26v9c0 12-9 17-24 17s-24-5-24-17z"/><path class="pet-inner" d="M23 14l6 21m24-21-5 21"/><g class="pet-eyes"><path d="M29 54v4m22-4v4"/></g><path d="m37 63 3 2 3-2m-3 2v3m-6 0c3 3 9 3 12 0"/><path class="pet-cheeks" d="M24 64h5m22 0h5"/><path class="pet-paw" d="M24 78v-6m32 6v-6"/></g></svg>
<span class="sf-companion-dot" hidden aria-hidden="true"></span><span class="sf-companion-label">Помощник</span></button>
<div id="companion-panel" class="sf-companion-panel" hidden data-hide-url="{{ url_for('assistant.hide_pet') }}" data-csrf="{{ assistant_csrf }}"><div class="sf-companion-heading"><strong>Клевер · помощник</strong><button type="button" data-pet-close aria-label="Закрыть питомца">×</button></div><p data-pet-copy>Спросите о продуктах или приготовлении.</p><a data-pet-current hidden href="{{ url_for('assistant.index',mode=assistant_pet_pending.mode if assistant_pet_pending else 'chat') }}">Открыть разговор →</a><a href="{{ url_for('assistant.index',mode='chat') }}">Открыть чат →</a><a href="{{ url_for('assistant.index',mode='cooking') }}">Помочь с готовкой →</a><button type="button" class="sf-companion-snooze" data-pet-hide>Скрыть до следующего входа</button><p class="sf-companion-status" role="status" data-pet-status></p><a class="sf-companion-settings" href="{{ url_for('workspace.settings') }}#assistant-pet-settings">Настроить или выключить</a></div>
</aside><script src="{{ url_for('static',filename='js/companion.js') }}" defer></script>
{% endif %}
