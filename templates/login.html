{% extends "base.html" %}
{% block title %}Вход — SmartFridge{% endblock %}

{% block content %}
<section class="auth-page">
  <div class="auth-aside">
    <p class="section-tag"><i></i> ВХОД В АККАУНТ</p>
    <h1>СНОВА<br><em>ВНУТРИ.</em></h1>
    <p>Войдите в аккаунт SmartFridge, чтобы продолжить.</p>
  </div>

  <div class="auth-card">
    <h2>Вход в систему</h2>
    <p class="auth-description">Введите данные своего аккаунта.</p>

    <form method="post" action="{{ url_for('login') }}" class="industrial-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

      <label class="field">
        <span>Электронная почта</span>
        <input type="email" name="email" autocomplete="email"
               placeholder="name@example.com" required>
      </label>

      <label class="field">
        <span>Пароль</span>
        <input type="password" name="password" autocomplete="current-password"
               placeholder="Введите пароль" required>
      </label>

      <button class="btn btn-primary action-wide" type="submit">
        Войти в аккаунт
      </button>
    </form>

    <div class="auth-bottom">
      <span>Ещё нет аккаунта?</span>
      <a href="{{ url_for('register') }}">Создать аккаунт</a>
    </div>
  </div>
</section>
{% endblock %}
